# Despliegue en Render (Blueprint). La clave se ingresa en el panel de Render, nunca aquí.
services:
  - type: web
    name: reto-03-ordenes-compra-sap
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_MODEL
        value: claude-opus-5-5
      - key: MAX_ITERACIONES
        value: "25"
      - key: MAX_TOKENS_SESION
        value: "400000"
