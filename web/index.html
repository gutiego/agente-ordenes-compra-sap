<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Órdenes de Compra SAP</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #677085; --border: #dfe3ea;
    --user: #e8f0fe; --accent: #2457c5; --ok: #1f7a4d; --err: #b3261e;
    --confirm-bg: #fff4d6; --confirm-border: #e0a800; --code: #f0f2f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1b1f27; --text: #e6e9ef; --muted: #98a1b3; --border: #2c3240;
      --user: #1f2b45; --accent: #7aa2ff; --ok: #5cc98f; --err: #ff8a80;
      --confirm-bg: #3a2f10; --confirm-border: #d9a520; --code: #232834;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { max-width: 920px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column; padding: 0 16px; }
  header { padding: 14px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; }
  header .meta { color: var(--muted); font-size: 13px; }
  header button { background: none; border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  #chat { flex: 1; overflow-y: auto; padding: 16px 0; display: flex; flex-direction: column; gap: 14px; }
  .msg { flex-shrink: 0; padding: 10px 14px; border-radius: 10px; background: var(--panel); border: 1px solid var(--border); overflow-x: auto; }
  .msg.usuario { background: var(--user); align-self: flex-end; max-width: 80%; white-space: pre-wrap; }
  .msg.error { border-color: var(--err); }
  .msg.confirmar { background: var(--confirm-bg); border: 2px solid var(--confirm-border); }
  .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--confirm-border); color: #000; margin-bottom: 6px; }
  .msg table { border-collapse: collapse; margin: 8px 0; font-size: 14px; }
  .msg th, .msg td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }
  .msg code { background: var(--code); padding: 1px 4px; border-radius: 4px; font-size: 13px; }
  .tools { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
  details.tool { border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font-size: 13px; background: var(--bg); }
  details.tool summary { cursor: pointer; }
  details.tool .ok { color: var(--ok); } details.tool .fail { color: var(--err); }
  details.tool pre { white-space: pre-wrap; word-break: break-word; background: var(--code); padding: 6px; border-radius: 4px; max-height: 260px; overflow: auto; }
  .acciones { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .acciones button { border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-weight: 600; }
  .si { background: var(--ok); color: #fff; } .no { background: var(--border); color: var(--text); }
  #pensando { color: var(--muted); font-style: italic; display: none; padding: 4px 0; }
  form { display: flex; gap: 8px; padding: 12px 0 16px; border-top: 1px solid var(--border); }
  textarea { flex: 1; resize: none; height: 64px; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font: inherit; }
  form button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 0 18px; font-weight: 600; cursor: pointer; }
  form button:disabled { opacity: .5; cursor: wait; }
  .sugerencias { display: flex; gap: 6px; flex-wrap: wrap; }
  .sugerencias button { font-size: 13px; border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 99px; padding: 4px 10px; cursor: pointer; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div><h1>Agente · Órdenes de Compra SAP</h1><div class="meta" id="meta">conectando…</div></div>
    <button id="nueva" type="button">Nueva sesión</button>
  </header>
  <div id="chat">
    <div class="msg">
      Hola. Leo el paquete de cada solicitud de compra, lo valido contra los maestros y preparo la orden de compra en SAP (simulado). Casos disponibles:
      <code>sol-001</code> … <code>sol-006</code>.
      <div class="sugerencias" style="margin-top:8px">
        <button data-texto='Procesa la solicitud "sol-004". Muéstrame la OC como quedaría en SAP, qué validaciones pasó y cuáles no, y no la crees hasta que yo lo confirme.'>Procesar sol-004 (ejemplo PRD)</button>
        <button data-texto='Procesa la solicitud "sol-001" y crea la OC si pasa todos los controles.'>Procesar sol-001</button>
        <button data-texto='Procesa la solicitud "sol-003".'>Procesar sol-003 (bloqueo)</button>
        <button data-texto='Procesa la solicitud "sol-005".'>Procesar sol-005 (retroactiva)</button>
      </div>
    </div>
  </div>
  <div id="pensando">El agente está pensando…</div>
  <form id="form">
    <textarea id="entrada" placeholder="Escribe un mensaje… (Enter para enviar, Shift+Enter para salto de línea)"></textarea>
    <button id="enviar">Enviar</button>
  </form>
</div>
<script>
const $ = (id) => document.getElementById(id)
const chat = $("chat")
let sessionId = null
try { sessionId = localStorage.getItem("sessionId") } catch {}

const md = (t) => DOMPurify.sanitize(marked.parse(t || ""))
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c])
const json = (v) => { try { return JSON.stringify(typeof v === "string" ? JSON.parse(v) : v, null, 2) } catch { return String(v) } }

function enlazarRutas(html) {
  // Convierte rutas out/... en enlaces de descarga.
  return html.replace(/(?<![\w/"])out\/([\w./-]+\.(?:txt|pdf|json|csv|jsonl))/g, (m, rel) => `<a href="/api/archivos/${rel}" target="_blank">${m}</a>`)
}

function pintarAgente(e) {
  const div = document.createElement("div")
  div.className = "msg" + (e.needsConfirmation ? " confirmar" : "") + (e.error ? " error" : "")
  let html = ""
  if (e.needsConfirmation) html += `<span class="badge">⚠ Requiere tu confirmación</span>`
  if (e.toolCalls?.length) {
    html += `<div class="tools">` + e.toolCalls.map((t) => `
      <details class="tool"><summary><span class="${t.ok ? "ok" : "fail"}">${t.ok ? "✔" : "✖"}</span> <b>${esc(t.nombre)}</b> — ${esc(t.resumen)}</summary>
      <div>Argumentos:</div><pre>${esc(json(t.args))}</pre><div>Resultado:</div><pre>${esc(json(t.resultado))}</pre></details>`).join("") + `</div>`
  }
  html += enlazarRutas(md(e.texto))
  div.innerHTML = html
  if (e.needsConfirmation) {
    const acc = document.createElement("div")
    acc.className = "acciones"
    acc.innerHTML = `<button class="si">Sí, confirmo</button><button class="no">No, todavía no</button>`
    acc.querySelector(".si").onclick = () => enviar("Sí, confirmo. Procede.")
    acc.querySelector(".no").onclick = () => enviar("No, todavía no.")
    div.appendChild(acc)
  }
  chat.appendChild(div)
}

function pintarUsuario(texto) {
  const div = document.createElement("div")
  div.className = "msg usuario"
  div.textContent = texto
  chat.appendChild(div)
}

const bajar = () => (chat.scrollTop = chat.scrollHeight)

async function enviar(texto) {
  texto = texto.trim()
  if (!texto) return
  document.querySelectorAll(".acciones").forEach((a) => a.remove())
  pintarUsuario(texto)
  $("entrada").value = ""
  $("enviar").disabled = true
  $("pensando").style.display = "block"
  bajar()
  try {
    const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(sessionId ? { sessionId, message: texto } : { message: texto }) })
    const d = await r.json()
    if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`)
    sessionId = d.sessionId
    try { localStorage.setItem("sessionId", sessionId) } catch {}
    pintarAgente({ texto: d.reply, toolCalls: d.toolCalls, needsConfirmation: d.needsConfirmation, error: d.error })
  } catch (e) {
    pintarAgente({ texto: `⚠️ No se pudo completar la solicitud: ${e.message}`, error: true })
  } finally {
    $("enviar").disabled = false
    $("pensando").style.display = "none"
    bajar()
  }
}

async function cargarHistorial() {
  if (!sessionId) return
  const r = await fetch(`/api/sessions/${sessionId}`)
  if (!r.ok) return
  const d = await r.json()
  for (const e of d.historial) e.rol === "usuario" ? pintarUsuario(e.texto) : pintarAgente(e)
  document.querySelectorAll(".acciones").forEach((a, i, all) => { if (i < all.length - 1) a.remove() })
  bajar()
}

$("form").onsubmit = (ev) => { ev.preventDefault(); enviar($("entrada").value) }
$("entrada").onkeydown = (ev) => { if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); enviar($("entrada").value) } }
document.querySelectorAll(".sugerencias button").forEach((b) => (b.onclick = () => enviar(b.dataset.texto)))
$("nueva").onclick = () => { try { localStorage.removeItem("sessionId") } catch {}; location.reload() }

fetch("/api/health").then((r) => r.json()).then((h) => ($("meta").textContent = `proveedor: ${h.provider} · modelo: ${h.model ?? "—"}`)).catch(() => ($("meta").textContent = "sin conexión con el servidor"))
cargarHistorial()
</script>
</body>
</html>
